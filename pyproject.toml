[project]
name = "apolitical-senior-data-engineer"
version = "0.1.0"
description = "Apolitical Senior Data Engineer technical test: an incident in a CRM sync pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-core>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "duckdb>=1.2.1,<2.0.0",
    "flask>=2.2.0",
    "pandas>=2.0.0",
    "pytest>=9.1.1",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed to run the DAG under Airflow itself; scripts/run_pipeline.py runs the same
# tasks without it. Install with: uv sync --extra airflow
airflow = [
    "apache-airflow==2.11.0",
]
