# dbt profile for DuckDB connection
# Candidates can run dbt from 2-dbt_project/ after setting: export DBT_PROFILES_DIR=$(pwd)
# This file defines the `course_engagement` profile used by dbt_project.yml
# The DuckDB path is relative to this directory

course_engagement:
  outputs:
    dev:
      type: duckdb
      path: ../mock_data.duckdb
      schema: analytics
      threads: 4

  target: dev
