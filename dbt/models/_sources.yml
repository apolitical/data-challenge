version: 2

sources:

  - name: raw
    schema: raw
    description: >
      Raw tables loaded by scripts/init_db.py from the CSV files in mock_data/. These are snapshots
      of upstream systems; nothing in this project writes to them.
    tables:

      - name: members
        description: >
          The member dimension, as delivered by the membership platform. Its grain is member x
          source_system: a member registered on more than one engagement platform has one row per
          platform, so member_id alone is not unique here. There is no update timestamp.
        columns:
          - name: member_id
            description: "Member identifier. Not unique on this table -- see the table description."
          - name: full_name
            description: "The member's full name."
          - name: email
            description: "The member's email address."
          - name: source_system
            description: >
              The engagement platform this row came from. Determines which upstream feed populates
              the member's activity, and whether the legacy lifetime counter is still maintained for
              them -- see MIGRATION_MANIFEST.md.
          - name: signup_date
            description: "Date the member signed up on this source system."
          - name: country
            description: "Two-letter country code."

      - name: member_activity
        description: >
          One snapshot per pipeline run date of the upstream engagement feed. This is the feed the
          engagement model reads.
        columns:
          - name: member_id
            description: "Member identifier."
          - name: snapshot_date
            description: "The pipeline run date this snapshot was delivered for."
          - name: recent_event_ids
            description: >
              Event identifiers for the member's activity in the recent window, as a list. May be
              missing, and may be an empty list; those are different values, and
              MIGRATION_MANIFEST.md documents what each one means.
          - name: legacy_event_count
            description: >
              The legacy platform's running count of the member's activity. Recalculated and re-sent
              every run for legacy_feed members, so it can go down; frozen at migration for
              engagement_v2 members -- see MIGRATION_MANIFEST.md.

      - name: events
        description: >
          The authoritative event log for the recent window, one row per event. The engagement
          model does not read this table; other pipelines do. As delivered it is the log as it
          stood for the 2026-09-29 run: complete to the end of 2026-09-28.
        columns:
          - name: event_id
            description: "Event identifier."
          - name: member_id
            description: "Member identifier."
          - name: event_type
            description: "What the member did."
          - name: event_timestamp
            description: "When it happened."

      - name: crm_member_state
        description: >
          The CRM's own member state, ingested back into the warehouse once per run. The values
          here were written by a previous run of this pipeline.
        columns:
          - name: member_id
            description: "Member identifier."
          - name: state_date
            description: "The date this state snapshot was taken from the CRM."
          - name: engagement_tier
            description: "The engagement tier the CRM currently holds for the member."
          - name: is_active
            description: >
              Whether the CRM considers the member active. Set by the sync: a member assigned the
              dormant tier is marked inactive.
          - name: last_synced_at
            description: "When the sync last wrote to this member."
