# Configuration for the sync-member-engagement pipeline.
# Loaded via utilities.common.get_dag_configs("sync_member_engagement", __runtime__).
# The `common` block applies everywhere; a runtime block overrides it key by key.

common:
  # Paths are relative to the repository root, resolved in the DAG file.
  dbt_project_dir: 2-dbt_project
  warehouse_file: mock_data.duckdb
  engagement_model: marts_engagement__member_tiers
  # Data tests the pipeline gates on before anything reaches the CRM.
  test_selector: "tag:critical"

production:
  test_selector: "tag:critical"
